<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AgriTrack ZW-Dashboard</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <h1>AgriTrack ZW</h1>
        <p>Farm Management Dashboard</p>
    </header>

    <nav>
<a href="index.html">Home</a>
    <a href="dashboard.html">Dashboard</a>
    <a href="iot.html">IoT Sensors</a>
    <a href="register.html">New Registration</a>

    </nav>

    <main>

        <h2>Farm Dashboard</h2>

        <section>
            <h3>Tracked Crops</h3>

            <form id="crop-form">

                <label for="crop-name">Crop Name:</label>
                <input type="text" id="crop-name" name="crop-name">

                <label for="crop-status">Crop Status:</label>
                <select id="crop-status" name="crop-status">
                    <option value="Planted">Planted</option>
                    <option value="Growing">Growing</option>
                    <option value="Harvested">Harvested</option>
                </select>

                <button type="submit">Add Crop</button>

            </form>

            <h3>The crop list</h3>

            <ul id="crop-list">
                <li>No crops added yet.</li>
            </ul>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 AgriTrack ZW</p>
    </footer>
<script type="module" src="js/app.js"></script>
</body>

</html>
